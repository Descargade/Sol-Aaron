services:
  - type: web
    name: nuestra-historia-api
    runtime: node
    plan: free
    rootDir: artifacts/api-server
    buildCommand: cd ../.. && pnpm install --frozen-lockfile && cd artifacts/api-server && pnpm run build
    startCommand: node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SOL_ADMIN_PASSWORD
        sync: false
      - key: AARON_ADMIN_PASSWORD
        sync: false
      - key: PRIVATE_OBJECT_DIR
        value: /data/uploads
      - key: PUBLIC_OBJECT_DIR
        value: /data/public
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
